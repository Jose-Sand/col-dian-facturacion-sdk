[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dian-facturacion-sdk"
version = "0.1.0"
description = "SDK completo para facturación electrónica Colombia: generación UBL 2.1, firma XMLDSig, cálculo CUFE y transmisión a proveedores tecnológicos homologados DIAN"
authors = [
    {name = "DIAN Facturación SDK Team", email = "dev@dian-facturacion.com"}
]
maintainers = [
    {name = "DIAN Facturacion SDK Team", email = "dev@dian-facturacion.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "dian",
    "facturacion-electronica",
    "ubl-2.1",
    "colombia",
    "xmldsig",
    "cufe",
    "factura-electronica",
    "nota-credito",
    "nota-debito",
    "documento-equivalente",
    "pos",
    "firma-digital",
    "certificado-digital"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Natural Language :: Spanish"
]
requires-python = ">=3.9"
dependencies = [
    "lxml>=4.9.0,<6.0.0",
    "cryptography>=41.0.0,<43.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.25.0,<1.0.0",
    "python-dateutil>=2.8.0,<3.0.0",
    "pytz>=2023.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0"
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0"
]
testing = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "faker>=19.3.0",
    "responses>=0.23.0"
]

[project.urls]
Homepage = "https://github.com/dian-facturacion/dian-facturacion-sdk"
Documentation = "https://dian-facturacion-sdk.readthedocs.io"
Repository = "https://github.com/dian-facturacion/dian-facturacion-sdk"
"Bug Tracker" = "https://github.com/dian-facturacion/dian-facturacion-sdk/issues"
Changelog = "https://github.com/dian-facturacion/dian-facturacion-sdk/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dian_facturacion*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
dian_facturacion = [
    "schemas/*.xsd",
    "templates/*.xml",
    "certificados/*.pem"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=dian_facturacion",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Pruebas unitarias básicas",
    "integration: Pruebas de integración con servicios externos",
    "slow: Pruebas que toman tiempo considerable",
    "requires_certificate: Pruebas que requieren certificado digital válido",
    "requires_network: Pruebas que requieren conexión a internet"
]

[tool.coverage.run]
source = ["src/dian_facturacion"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod"
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip_glob = ["*/venv/*", "*/.venv/*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return